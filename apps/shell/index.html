<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      The same policy as apps/demo. Kept verbatim rather than shared, because the reasoning about which
      directives are header-only (`frame-ancestors`, `report-uri`, `sandbox` are all silently ignored in a meta
      tag) belongs next to the tag that omits them — see apps/demo/index.html and docs/deployment.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self';
        connect-src 'self';
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'none';
        form-action 'none'
      "
    />
    <title>MassingViewer — React shell</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
