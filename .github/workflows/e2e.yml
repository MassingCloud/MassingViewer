name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    # A hard ceiling, not an estimate. A hung job is worse than a failing one — it burns to GitHub's six-hour
    # default and reports nothing at all — and that is not hypothetical: Playwright's own webServer management
    # hung indefinitely on teardown during development, which is why the lifecycle now lives in scripts/e2e.mjs.
    #
    # Raised 15 → 30 because 15 was too tight for the wrong reason. The tests take about 25 seconds; what blew
    # the budget was `playwright install --with-deps` on a slow apt mirror, where a single 9 MB package took over
    # four minutes and the iPad leg was cancelled mid-download. Cancelling a green run because a Ubuntu mirror was
    # slow is a false negative, and a matrix leg that fails for reasons unrelated to the code is how a suite stops
    # being trusted.
    #
    # The install step carries its own tighter timeout below, so a genuinely *hung* download still fails fast and
    # says which step it was — the job ceiling bounds hangs, the step ceiling localises them.
    timeout-minutes: 30
    strategy:
      # Do not cancel the whole matrix when one browser fails. A WebKit-only failure is exactly the finding
      # worth having, and killing the Chromium leg alongside it destroys the comparison that identifies it.
      fail-fast: false
      matrix:
        # `shell` is the React host, and it is a required leg rather than a nice-to-have: its job is to assert
        # that `apps/demo` (vanilla, the shape massing's shell is) and `apps/shell` (React) render the *same*
        # ribbon from the same package. That is the claim ADR-0009 rests on, and if it stops holding, M9 means
        # putting React into massing. A cross-host claim cannot be checked from inside one host.
        # `a11y` is the WCAG 2.2 AA gate, Chromium-only on purpose — see the note in playwright.config.ts.
        project: [chromium, firefox, webkit, ipad, shell, a11y]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # zizmor[artipacked]: the job token is not needed and must not sit in .git/config
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Which browser does this leg need?
        id: browser
        # A project name is not a browser name: `ipad` runs on WebKit and `shell` on Chromium, so two pairs of
        # legs share a binary — which is precisely what makes the cache below worth having. Falling through to
        # `matrix.project` for those would try to install a browser called "shell" and fail on a name.
        run: |
          case "${{ matrix.project }}" in
            ipad)  echo "name=webkit" >> "$GITHUB_OUTPUT" ;;
            shell) echo "name=chromium" >> "$GITHUB_OUTPUT" ;;
            a11y)  echo "name=chromium" >> "$GITHUB_OUTPUT" ;;
            *)     echo "name=${{ matrix.project }}" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache the browser binaries
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version, because a browser build is pinned to it — a stale cache would serve
          # a binary Playwright refuses to drive, which fails in a way that looks like a browser bug.
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.version }}-${{ steps.browser.outputs.name }}

      - name: Install the browser
        # Split into binary and system dependencies, because they cache differently and fail differently.
        #
        # The binary download is cacheable and skipped entirely on a hit. `install-deps` is apt, which is not
        # cacheable and is the part that was crawling — so it runs every time and carries the tight timeout. The
        # combined `--with-deps` form made a cache hit impossible for either half.
        timeout-minutes: 12
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install "${{ steps.browser.outputs.name }}"
          else
            echo "::notice::browser binary restored from cache"
          fi
          npx playwright install-deps "${{ steps.browser.outputs.name }}"

      - name: Run E2E
        # `npm run e2e`, not `npx playwright test`: this config has no webServer block, and the orchestrator
        # owns building, serving, running and stopping. See scripts/e2e.mjs.
        #
        # Firefox runs headed under Xvfb. Headless Firefox on Linux has no GL drawable, so WebGL cannot be
        # created at all and every test fails on an app that never finishes initialising — confirmed twice by the
        # diagnostic in e2e/global-setup.ts reporting "WebGL: UNAVAILABLE". Xvfb gives it a surface. Chromium
        # needs none of this because SwiftShader rasterises entirely in software, which is also why Chromium is
        # the project that carries any pixel-level assertions.
        run: |
          if [ "${{ matrix.project }}" = "firefox" ]; then
            E2E_HEADED=1 xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run e2e -- --project=firefox
          else
            npm run e2e -- --project=${{ matrix.project }}
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
