name: Pages

# Deploys the demo, and then asserts the deployed page actually renders a building.
#
# The post-deploy smoke test is the point of this workflow, not an extra. massing's Pages demo has been live
# and broken for a long time — it fetches a model that does not exist, so it shows no geometry at all, and
# nothing noticed because "deployed successfully" and "works" are different claims. A broken demo is the most
# expensive kind of broken: it is the first thing a prospective user sees.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # zizmor[artipacked]: the job token is not needed and must not sit in .git/config
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build the demo
        # `base: "./"` in the demo's vite config means the build works from a subpath with no rebuild, so there
        # is no BASE_URL to get wrong here.
        run: npm run build --workspace @massingviewer/demo

      - name: Bundle budget
        # Checked here as well as in CI, because this is the artifact users actually download.
        run: npm run gate:bundle

      - name: No third-party origins
        # The offline claim, enforced on the built output rather than trusted. A CDN font or an analytics
        # snippet would silently break "the model never leaves your browser".
        run: |
          if grep -rIlE 'https?://(?!localhost)' apps/demo/dist --include='*.js' --include='*.css' --include='*.html' -P 2>/dev/null | head -1 | grep -q .; then
            echo "::error::the built demo references a third-party origin"
            grep -rIoE 'https?://[a-zA-Z0-9.-]+' apps/demo/dist --include='*.js' --include='*.css' --include='*.html' | sort -u | head -20
            exit 1
          fi
          echo "no third-party origins in the built output"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    # The whole reason this workflow is three jobs. Deploying successfully and working are different claims,
    # and only this job checks the second one.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # zizmor[artipacked]: the job token is not needed and must not sit in .git/config
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: The deployed page renders a building
        env:
          # Set by the deploy job's environment; falls back to the conventional Pages URL.
          SMOKE_URL: ${{ needs.deploy.outputs.page_url || 'https://massingcloud.github.io/MassingViewer/' }}
        run: node scripts/smoke-deployed.mjs "$SMOKE_URL"
