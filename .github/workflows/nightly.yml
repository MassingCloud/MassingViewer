name: Nightly

# Checks that are valuable but too slow or too non-deterministic to gate a PR on.
#
# The split is deliberate and is this repo's stated principle about gates applied to its own CI: a check
# that fails on some runs and not others gets muted or retried, and then it protects nothing. So anything
# inherently explorative runs here, where a failure opens an issue rather than blocking someone's PR.

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# ## Outstanding, and named here rather than left implicit
#
# Three jobs the plan asks for and this workflow does not yet run. Written down because a nightly that runs one job
# reads, at a glance, like a nightly that runs everything — and `docs/testing.md` points here for the gap:
#
#   - **p95 frame time.** The `perf` job below measures *drawing generation*, which is a pure function and belongs
#     in Node. Frame time is a browser measurement and needs a rendering loop instrumented over many frames; the
#     visual job renders single frames and cannot report it.
#   - **The long-task gate.** Nothing over 50 ms during the golden path, which is what keeps the Worker boundary real
#     rather than nominal. The perf job below measures drawing generation in Node, where there is no main thread to
#     block, so this needs a browser trace.
#
# **Tier-3 drawing rasterisation is done** and runs in the `raster` job below.
#
# The **memory-leak gate is done** and runs per-PR rather than here: `e2e/memory.spec.ts` takes about five seconds
# and is exactly deterministic, so deferring it to a nightly would only delay the signal. See docs/testing.md.
#   - **A docker-composed massing backend** for `@massing/kernel-remote`'s conformance suite, so it runs against a
#     real service rather than the in-repo stub. See docs/kernels/authoring.md.
#
# And two workflows the plan lists that are **not applicable yet rather than missing**: `desktop.yml` and
# `mobile.yml` would package apps that do not exist — `apps/` holds `demo` and `shell`, and there is no Electron,
# Tauri or Capacitor dependency anywhere. Creating empty workflows to match a checklist would be theatre. They
# arrive with the apps.

jobs:
  property-explore:
    name: Property tests, random seed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # zizmor[artipacked]: the job token is not needed and must not sit in .git/config
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Explore with a fresh seed
        id: explore
        # PR runs are seeded so they are reproducible; this run is not, so it keeps finding cases nobody
        # thought of. That is exactly how the two real findings in properties.test.ts surfaced — one of
        # them only in CI, on a seed the local run never reached.
        env:
          FAST_CHECK_SEED: random
        run: npm run test:fast

      - name: Open an issue with the reproducing seed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The seed is printed in the failure output, and `FAST_CHECK_SEED=<seed> npm run test:fast`
        # reproduces it exactly. Without that the issue would be unactionable, which is how an explorative
        # job turns into noise.
        run: |
          gh issue create \
            --title "Nightly property test found a counterexample" \
            --label "bug" \
            --body "A random-seed property run failed. The log prints \`{ seed: … }\` — reproduce with:

          \`\`\`bash
          FAST_CHECK_SEED=<seed> npm run test:fast
          \`\`\`

          Then decide which it is, because both happen and the difference matters:

          - **The code is wrong** — fix it, and add the counterexample as a named example test so it
            cannot regress.
          - **The property was wrong** — the invariant does not actually hold in that region. Narrow the
            property to its true domain and *write down why*, as \`properties.test.ts\` already does for
            the snap tie-break epsilon and the orientation-determinant cancellation. Silently loosening a
            property until it passes is how a suite stops meaning anything.

          Run: $RUN_URL"

  visual:
    name: Viewport visual regression
    runs-on: ubuntu-latest
    # A hung browser job burns to GitHub's six-hour default and reports nothing, which is worse than a failure.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # zizmor[artipacked]: the job token is not needed and must not sit in .git/config
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Silhouette occupancy and luminance
        # Gated on occupancy and a luminance histogram rather than on pixels or SSIM. `docs/testing.md` rules out
        # per-PR pixel comparison outright: it fails on one driver's antialiasing, the reflex becomes accepting
        # every new baseline, and the suite becomes decoration that still reports green.
        #
        # SwiftShader is what makes the baseline meaningful — a software rasteriser produces identical output on any
        # host. Baselines are keyed by renderer string, so a runner image that changes its ANGLE version fails
        # loudly with "no baseline for renderer …" instead of silently comparing two different rasterisers.
        run: npm run e2e -- --project=visual

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
            e2e/visual/
          retention-days: 14

  raster:
    name: Tier-3 drawing rasterisation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # zizmor[artipacked]: the job token is not needed and must not sit in .git/config
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Render the golden plans and compare pixels
        # Nightly rather than per-PR for one reason, and it is the plan's risk #11: pixel baselines are the classic
        # vehicle for reflexive re-baselining. Keeping the failure out of the merge path keeps it something someone
        # investigates. The comparator itself is covered per-PR by `fixtures/raster-compare.test.ts`, because a
        # comparator that answers "same" to everything makes this job green while asserting nothing.
        #
        # First run on Linux is also a measurement: the baselines were rendered on win32-x64, and whether resvg
        # agrees bit-for-bit across architectures is stated as an open question in `raster-compare.ts` rather than
        # assumed. If it disagrees, the failure prints the differing-pixel count and the worst channel delta, and
        # AA_TOLERANCE gets set from that instead of guessed.
        env:
          RASTER: "1"
        run: npx vitest run fixtures/raster.test.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          # The render and a diff image per failing view. A raster failure that ships only a similarity number is
          # not diagnosable — the whole value is being able to look at what changed.
          name: raster-diff
          path: test-results/raster/
          retention-days: 14

  perf:
    name: Drawing generation budgets and trend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: p95 against budget, and scaling
        # Two checks, and the second is the one a per-case budget cannot make: per-mesh cost is compared between two
        # single-storey cases where every element is genuinely sectioned, so 25x the elements should cost roughly
        # 25x the time. A quadratic sectioner bends that curve while every absolute number stays inside its budget.
        #
        # The budgets currently carry "baselined": false — they are developer-machine measurements times three, and
        # three is a guess. See perf/README.md: let this job run for a week, read the trend, set real numbers.
        env:
          PERF_TREND: append
          PERF_STAMP: ${{ github.event.repository.updated_at }}
        run: node scripts/perf-drawings.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          # Uploaded even on success, because the *trend* is the output. The committed perf/trend.jsonl is the
          # durable record; this is how a run's line gets read before someone commits it.
          name: perf-trend
          path: perf/trend.jsonl
          retention-days: 90
