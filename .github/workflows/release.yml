name: Release

# Publishing is gated on a secret that is deliberately not set yet.
#
# `NPM_TOKEN` is absent, so this workflow will refuse rather than half-publish. That is the intended state:
# publishing to a shared npm scope is public and effectively irreversible (a version number can never be
# reused, even after `npm unpublish`), so it needs a deliberate act by someone with the credentials — not a
# side effect of merging a PR.
#
# To enable: add `NPM_TOKEN` (an automation token for the @massingviewer scope) under repository secrets. The
# workflow then publishes with npm provenance, so a consumer can verify the tarball was built by this repo's CI
# rather than someone's laptop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release commit and tags
      pull-requests: write # open the version PR
      id-token: write # npm provenance via OIDC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history so changesets can work out what changed since the last release.
          fetch-depth: 0
          # Credentials ARE needed here: this job pushes the version commit and tags. The one workflow where
          # the zizmor artipacked exception is justified, so it is stated rather than left as an inconsistency.
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Everything the PR gates check, again, on the exact tree about to be published. A release is the one
      # place where re-running a check that already passed is worth the minutes: the cost of publishing a
      # broken version is a version number burned for ever.
      - name: Verify
        run: npm run verify

      - name: Guard — refuse to publish without a token
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN is not set, so nothing will be published."
            echo "This is the intended default. Publishing to a shared npm scope is irreversible — a version"
            echo "number can never be reused — so it requires someone with credentials to opt in by adding the"
            echo "secret. See docs/adr/0002-vendor-vs-depend.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate SBOM for the release
        if: steps.guard.outputs.skip == 'false'
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-format JSON --output-file sbom.cdx.json

      - name: Create a version PR, or publish
        if: steps.guard.outputs.skip == 'false'
        uses: changesets/action@c8bada60c408975afd1a20b3db81d6eee6789308 # v1.4.9
        with:
          # `changeset version` on a normal push opens a release PR; merging that PR is what actually
          # publishes. Two steps deliberately: it means the version bump and changelog are reviewable, and
          # nobody publishes by accident.
          version: npm run changeset:version
          publish: npm run changeset:publish
          commit: "release: version packages"
          title: "release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires the OIDC token above. Without it npm publishes unsigned, which defeats the
          # point of pinning and auditing everything else.
          NPM_CONFIG_PROVENANCE: "true"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.guard.outputs.skip == 'false'
        with:
          name: sbom-release
          path: sbom.cdx.json
          retention-days: 365
