name: Release

# Publishing happens on a `release-*` tag, and the version bump happens on a human's machine.
#
# ## Why not a version PR
#
# The previous design used `changesets/action` to open a version PR and publish when it merged. It never worked
# here: **the `MassingCloud` organisation has "Allow GitHub Actions to create and approve pull requests" off**, and
# that setting is hierarchical — enterprise, then organisation, then repository — so a lower level can never grant
# what a higher one withholds. The job requested `pull-requests: write` and got it, and the org policy refused the
# API call anyway.
#
# That policy is off by *default*, and for a good reason: a workflow that can open a PR is a privilege-escalation
# path, because a second workflow can approve it. Loosening an org-wide policy for every current and future repo,
# to gain a convenience PR in one, is the wrong trade for a repository that SHA-pins every action, runs gitleaks
# with an empty ignore file, and publishes with provenance.
#
# So the release stopped needing the permission instead of asking for it. This workflow has **strictly less**
# authority than the one it replaces: no `pull-requests` scope at all, and nothing here writes a version.
#
# ## The flow
#
#   1. `npm run changeset:version` locally — bumps versions, writes changelogs, consumes the changesets.
#   2. Read the diff. This is the review step the version PR was providing, and reading a local diff is more
#      review than approving a bot's PR.
#   3. Commit it, push, then `git tag release-<date>` and push the tag.
#   4. This workflow verifies, checks the tree is publishable, and publishes.
#
# ## What is still gated
#
# `NPM_TOKEN` absent means nothing is published — a notice, not a failure. Publishing to a shared npm scope is
# irreversible: a version number can never be reused, even after `npm unpublish`. See docs/releasing.md.

on:
  push:
    tags: ["release-*"]
  # For a dry run: everything except the publish, so the gates can be exercised without burning a version.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Pushing the per-package tags `changeset publish` creates. Those tags are the authoritative record of
      # what shipped, and the step below has to push them explicitly — `changeset publish` creates them
      # **locally only**. The first release proved it: twenty tags were created on the runner, none reached the
      # remote, and they died with the runner. The comment here used to claim changesets pushed them, which is
      # exactly the kind of wrong-but-plausible note that stops anyone checking.
      contents: write
      # npm provenance via OIDC. Without it the tarball is unsigned, which would defeat the point of pinning and
      # auditing everything else.
      id-token: write
      # Deliberately NO `pull-requests` scope. Nothing here opens a PR, so nothing here should be able to.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history so changesets can see what was already released.
          fetch-depth: 0
          # Needed so the tag-push step below can authenticate. Narrower than before, where the same credentials
          # also pushed a version commit and opened a PR.
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # **Caching off, explicitly.** A security fix rather than an oversight, and `zizmor` raised it as
          # high-severity cache-poisoning the moment this workflow became a publishing one.
          #
          # The Actions cache is readable across workflows and writable by ones running on *less* trusted
          # triggers. A job that publishes to npm must not restore a shared, externally-writable cache: an
          # attacker who can poison it can influence the tarballs that go out under this repository's provenance
          # attestation — which turns the attestation from a guarantee into a misleading one.
          #
          # Dropping `cache: npm` was **not sufficient**, and I had assumed it was. `setup-node`'s own
          # `action.yml` says it: *"Set to false to disable automatic caching based on the package manager field
          # in package.json. By default, caching is enabled if the packageManager field is present."* This repo
          # declares `packageManager: npm@11.16.0`, so the cache was still being restored. zizmor was reporting a
          # real finding, not flagging the action heuristically — worth remembering the next time a linter looks
          # like it is being pedantic about something already fixed.
          #
          # A release runs a handful of times a year. Ninety seconds of `npm ci` is not worth any of that.
          package-manager-cache: false

      - run: npm ci

      # Everything the PR gates check, again, on the exact tree about to be published. A release is the one place
      # where re-running a check that already passed is worth the minutes: the cost of publishing a broken version
      # is a version number burned for ever.
      - name: Verify
        run: npm run verify

      # The gate this design needs. Moving `changeset version` onto a laptop buys the privilege reduction above
      # and introduces exactly one new failure mode: tagging without having run it. That fails *silently* —
      # `changeset publish` finds every version already on npm, publishes nothing, and exits 0, so the release
      # looks successful while shipping nothing. Or worse, a partial version run ships a set of versions that were
      # never tested together.
      - name: Release readiness (versions bumped, changelogs written, nothing pending)
        run: npm run gate:release

      - name: Guard — refuse to publish without a token
        id: guard
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN is not set, so nothing will be published."
            echo "This is the intended default. Publishing to a shared npm scope is irreversible — a version"
            echo "number can never be reused — so it requires someone with credentials to opt in by adding the"
            echo "secret. See docs/adr/0002-vendor-vs-depend.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A manual run is a dry run: the gates above are the point, and publishing on a button press would make the
      # deliberate act — pushing a tag — bypassable.
      - name: Note that a manual run does not publish
        if: github.event_name == 'workflow_dispatch'
        run: echo "::notice::workflow_dispatch is a dry run. Push a release-* tag to publish."

      - name: Generate SBOM for the release
        if: steps.guard.outputs.skip == 'false' && github.event_name == 'push'
        # Written **outside the working tree**, deliberately. It used to land in the repo root, and the changesets
        # action ran `git add .` — so the first release run committed a 486 KB generated SBOM onto the release
        # branch, and every release after it would have done the same. The changesets action is gone now, but the
        # reasoning stands on its own: a generated artifact in version control is noise that grows.
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-format JSON --output-file "$RUNNER_TEMP/sbom.cdx.json"

      - name: Publish
        if: steps.guard.outputs.skip == 'false' && github.event_name == 'push'
        # `changeset publish` directly, not the action. It publishes every package whose version is not yet on
        # npm and creates a git tag per package — and it is a no-op for anything already published, so a re-run
        # of a failed release is safe rather than a second attempt at a burned version.
        run: npm run changeset:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push the per-package tags
        if: steps.guard.outputs.skip == 'false' && github.event_name == 'push'
        # `changeset publish` created these locally. Without this they are lost with the runner, and the repo has
        # no record of which commit produced `@massing/core@0.1.0` — which is the one question a bisect over a
        # published regression has to answer.
        #
        # `--no-verify` is deliberately absent, and `|| true` deliberately too: a tag push that fails should be
        # visible. It cannot clobber anything, because every tag names a version that was just published for the
        # first time, so a collision would mean something is badly wrong and is worth failing on.
        run: git push origin --tags

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.guard.outputs.skip == 'false' && github.event_name == 'push'
        with:
          name: sbom-release
          path: ${{ runner.temp }}/sbom.cdx.json
          retention-days: 365
