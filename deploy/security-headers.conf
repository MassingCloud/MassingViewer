# Security headers for a self-hosted MassingViewer deployment (nginx syntax).
#
# The demo ships a Content-Security-Policy as a `<meta>` tag, because GitHub Pages cannot set headers at all.
# That covers most of the policy, but **three directives are header-only and are silently ignored in a meta
# tag**: `frame-ancestors`, `report-uri`/`report-to`, and `sandbox`. Chrome logs an error for the first, which
# is how we found it — a policy that looked like it prevented clickjacking did not.
#
# So a real deployment must send the policy as a header. This file is the reference.

# --- Content Security Policy ------------------------------------------------------------------------
#
# `wasm-unsafe-eval` is the narrow grant WebAssembly needs. Do NOT widen it to `unsafe-eval`, which also
# permits eval() and new Function() — a materially larger hole, and the usual mistake when a WASM CSP error
# first appears.
#
# `connect-src 'self'` is load-bearing: with the local kernel the model never leaves the browser, and this is
# what makes that structural rather than merely true today. Add your own origin here only if you deploy the
# remote kernel, and add nothing else.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; require-trusted-types-for 'script'" always;

# --- Cross-origin isolation -------------------------------------------------------------------------
#
# Needed for SharedArrayBuffer, which multithreaded WASM geometry requires. Without these the app still works
# but falls back to single-threaded — a real performance cliff, so it should be VISIBLE rather than silent.
# The app logs a warning when `crossOriginIsolated` is false for exactly that reason.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# --- The rest ---------------------------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Nothing in this app needs a camera, a microphone, or geolocation. Denying them is free.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HSTS. Only enable once you are certain the domain is HTTPS-only — it is hard to walk back.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# WASM must be served with the right type or the browser refuses to compile it streaming.
types { application/wasm wasm; }
